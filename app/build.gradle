// FILE: app/build.gradle

plugins {
    id 'com.android.application'
}

android {
    namespace         'com.announceupi.in'
    compileSdk        34

    defaultConfig {
        applicationId   "com.announceupi.in"
        minSdk          23
        targetSdk       34
        versionCode     2
        versionName     "2.0"
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // Biometric lock (fingerprint / PIN)
    implementation 'androidx.biometric:biometric:1.1.0'

    // WorkManager (daily summary notification scheduler)
    implementation 'androidx.work:work-runtime:2.9.0'

    // MPAndroidChart (monthly bar chart)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Glide â€” profile picture loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}